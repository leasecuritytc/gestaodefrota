# Bloco Nginx isolado para a GESTÃO DE FROTA.
# Não altera, não inclui nem depende de nenhum bloco existente
# (licitahelp.com.br, security3c). Copiar para
# /etc/nginx/sites-available/gestaodefrota e linkar em sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name alexander-log.com.br www.alexander-log.com.br;

    # Necessário para o certbot validar o domínio antes de existir certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alexander-log.com.br www.alexander-log.com.br;

    # O certbot substitui estas duas linhas pelos caminhos reais na primeira emissão.
    ssl_certificate     /etc/letsencrypt/live/alexander-log.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexander-log.com.br/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build estático do frontend (React/Vite). Gerado por
    # "npm run build" dentro de frontend/ e publicado aqui — ver
    # README, seção "Deploy do frontend".
    root /var/www/gestaodefrota/frontend/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: qualquer rota que não seja arquivo real cai no index.html
    # (o React Router decide o resto no navegador).
    # index.html sempre revalidado: depois de cada deploy o navegador pega a
    # versão nova na hora (os arquivos de /assets/ têm hash no nome, então
    # esses podem ficar em cache "para sempre" sem risco).
    # Obs.: add_header dentro de location anula os do bloco server — por isso
    # os cabeçalhos de segurança são repetidos aqui.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
